<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آموزش تایپ انگلیسی و فارسی</title>
<style>
:root{--bg:#eaf1f2;--card:#fff;--ink:#10262e;--mute:#587078;--line:#cfdcdf;--acc:#0b7a75;--onacc:#fff;--bad:#c2410c;--cur:#ffd96b;--ok:#0b7a75;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--card:#15262d;--ink:#e6f0f2;--mute:#92a9b0;--line:#27414a;--acc:#3cc5bb;--onacc:#06201e;--bad:#ff8a5c;--cur:#7a5f0c;--ok:#3cc5bb;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1f;--card:#15262d;--ink:#e6f0f2;--mute:#92a9b0;--line:#27414a;--acc:#3cc5bb;--onacc:#06201e;--bad:#ff8a5c;--cur:#7a5f0c;--ok:#3cc5bb;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.7rem;font-weight:800}
header p{margin:2px 0 8px;color:var(--mute)}
.tabs{display:flex;gap:8px}
.tabs button{all:unset;cursor:pointer;padding:6px 18px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
main{max-width:1100px;margin:auto;padding:8px 16px 32px;display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;max-height:80vh;overflow:auto}
aside summary{cursor:pointer;font-weight:600;padding:8px 0}
@media(min-width:821px){aside summary{display:none}aside{position:sticky;top:8px}}
h3{margin:14px 0 4px;font-size:1rem;color:var(--acc)}
.ls{display:flex;flex-direction:column;gap:2px}
.ls button{all:unset;text-align:start;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.4}
.ls button:hover{background:var(--bg)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ls button.on{background:var(--acc);color:var(--onacc)}
.ls small{white-space:nowrap}
section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#ttl{margin:0 0 10px;font-size:1.05rem;font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stats div{flex:1 1 90px;background:var(--bg);border-radius:10px;padding:6px 10px;text-align:center}
.stats b{display:block;font-size:1.3rem;font-weight:800}
.stats span{font-size:.78rem;color:var(--mute)}
#bw{position:relative}
#box{position:relative;font:500 1.45rem/2.1 "Roboto Mono",Consolas,"Courier New",monospace;border:2px solid var(--line);border-radius:10px;padding:10px 16px;cursor:text;height:200px;overflow-y:auto}
#box.fa{font:500 1.6rem/2.3 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
#bw:focus-within #box{border-color:var(--acc)}
.w{display:inline-block;white-space:pre}
.c{color:var(--mute)}
.c.ok{color:var(--ok)}
.c.cur{background:var(--cur);color:var(--ink);border-radius:4px}
.c.err{background:var(--bad);color:#fff;border-radius:4px}
#cap{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;cursor:text}
#hint{margin:10px 0;color:var(--mute);min-height:1.7em}
#kb{direction:ltr;display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:8px;user-select:none}
.r{display:flex;gap:5px}
.k{width:clamp(22px,6.4vw,46px);height:clamp(26px,7vw,46px);border-radius:7px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font:500 clamp(.7rem,2.4vw,1rem) Vazirmatn,Tahoma,"Roboto Mono",monospace}
.k.sp{width:clamp(130px,40vw,280px)}
.k.nx{background:var(--cur);color:var(--ink);border-color:var(--ink);transform:translateY(2px)}
.f0{border-bottom:4px solid #d9486e}.f1{border-bottom:4px solid #e08a1e}.f2{border-bottom:4px solid #c9b000}.f3{border-bottom:4px solid #3aa655}
.f4{border-bottom:4px solid #2c9bb8}.f5{border-bottom:4px solid #4a6fd6}.f6{border-bottom:4px solid #8a5bd0}.f7{border-bottom:4px solid #c056a8}
.row2{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--acc);color:var(--onacc);padding:8px 18px;border-radius:9px;font-weight:600}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#res{display:none;margin-top:14px;border:2px solid var(--acc);border-radius:12px;padding:14px;text-align:center}
#res.show{display:block}
#res h2{margin:0 0 4px;font-size:1.25rem}
#stars{font-size:1.8rem;letter-spacing:4px;color:#e0a800}
footer{max-width:1100px;margin:auto;padding:0 16px 24px;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>آموزش تایپ انگلیسی و فارسی</h1>
  <p>از ردیف اصلی شروع کنید و قدم به قدم تا تایپ سریع و بدون خطا پیش بروید.</p>
  <div class="tabs"><button id="tEn">English Typing</button><button id="tFa">تایپ فارسی</button></div>
</header>
<main>
  <aside><details id="menu" open><summary>فهرست درس‌ها</summary><div id="list"></div></details></aside>
  <section class="panel">
    <h2 id="ttl" dir="auto"></h2>
    <div class="stats">
      <div><b id="sW">0</b><span>سرعت (WPM)</span></div>
      <div><b id="sA">100%</b><span>دقت</span></div>
      <div><b id="sT">0:00</b><span>زمان</span></div>
      <div><b id="sP">0%</b><span>پیشرفت</span></div>
    </div>
    <div id="bw"><div id="box"><div id="txt"></div></div>
      <input id="cap" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="اینجا تایپ کنید"></div>
    <div id="hint">روی کادر کلیک کنید و شروع به تایپ کنید.</div>
    <div id="kb"></div>
    <div id="res"><h2 id="rt"></h2><div id="stars"></div><p id="rd"></p>
      <div class="row2" style="justify-content:center"><button class="btn alt" id="again">تکرار درس</button><button class="btn" id="next">درس بعدی</button></div></div>
    <div class="row2"><button class="btn alt" id="restart">شروع دوباره (Esc)</button><button class="btn alt" id="snd">🔊 صدا روشن</button></div>
  </section>
</main>

const STORIES={en:{f:"fiona and her father lived in a small farm house far from the city. every friday, fiona fed the chickens, fixed the fence, and filled the water for the four fat sheep. her father, frank, was a fisherman before he became a farmer, and he often told her fine stories about the fast river and the fish he found there. one foggy morning, fiona found a funny little box near the fence. the box was soft and warm, and inside it was a fluffy fox cub. the cub was so small that it fit in her hand. fiona felt a flutter in her heart. she ran to find her father and cried, father, father, i found a friend. frank frowned at first, for a fox is a wild animal, and a farm full of hens is not a safe place for a fox. but when he saw the frightened face of the cub, his heart softened. we will feed him for a few days, said frank, and when he is strong, we will set him free. fiona was fine with that plan. she named the cub fudge, for his fur was the color of fresh fudge. every morning fiona fetched fresh milk, and every afternoon she found fruit and food for fudge. the fox grew faster than anyone had foreseen. in a few weeks he followed her around the field, and he fell asleep at her feet by the fire. but one frosty friday, fudge was gone. the door of the shed was open, and a trail of small footprints led to the forest. fiona felt her stomach fall. she fought back tears and followed the footprints, past the frozen fountain, past the old fig tree, and far into the dark forest. the wind was fierce and the fog grew thicker, but she did not stop. at last, in a quiet field of ferns, she saw fudge. he was not alone. beside him stood a large female fox, and two little cubs played near her feet. fudge looked at fiona, and for a moment the whole forest felt still. then he gave a soft, friendly cry, as if to say, thank you for everything, my friend. fiona smiled through her tears. she understood now that fudge had found his family. she waved a last farewell and walked home slowly function makeStory(l,k){const b=BANK[l][k].split(" "),n=b.slice(1);return TPL[l].replace(/\{(\d+)\}/g,(m,i)=>+i?n[(+i-1)%n.length]:b[0])}
function clean(s){const ok=fa()?new Set(Object.values(FA).concat([" "])):new Set("abcdefghijklmnopqrstuvwxyz ,.;/".split(""));return s.toLowerCase().split("").map(c=>c==="\n"?" ":c).filter(c=>ok.has(c)).join("").replace(/\s+/g," ").trim()}
let muted=false,AC=null;try{muted=localStorage.getItem("tp2-mute")==="1"}catch(e){}
function beep(good){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=good?"sine":"square";o.frequency.value=good?880:150;g.gain.setValueAtTime(good?.07:.06,t);g.gain.exponentialRampToValueAtTime(.001,t+(good?.08:.18));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(good?.09:.19))}catch(e){}}
const FN=["کوچک چپ","حلقه چپ","وسط چپ","اشاره چپ","اشاره راست","وسط راست","حلقه راست","کوچک راست"];
const FP={};[["1qaz",0],["2wsx",1],["3edc",2],["4rfv5tgb",3],["6yhn7ujm",4],["8ik,",5],["9ol.",6],["0p;/[]'",7]].forEach(([k,v])=>k.split("").forEach(c=>FP[c]=v));
const FULL="qwertyuiopasdfghjkl;zxcvbnm,[]'";
const $=id=>document.getElementById(id);
let lang="en",S=[],ALL=[],prog={},cur=0,text="",pos=0,ok=0,err=0,t0=0,tm=null,done=false,wrong=false,chars=[];
const fa=()=>lang==="fa", tl=c=>fa()?(FA[c]||c):c;
const fing=c=>{const k=fa()?Object.keys(FA).find(x=>FA[x]===c):c;return FP[k]};
function build(){
  S=[];let pool="";
  const nm=p=>p.split("").map(tl).join(fa()?" و ":" and ");
  const T=(k,p)=>fa()?({intro:"معرفی کلیدهای ",prac:"تمرین کلیدهای ",rev:"مرور کلیدهای ",big:"۳۰۰ کلمه: "}[k]+nm(p)):({intro:"Intro to ",prac:"Practice of ",rev:"Review with ",big:"300 Words: "}[k]+nm(p)+" keys");
  const sec=n=>{S.push({n,ls:[]});return S[S.length-1]};
  const four=(s,p,skipRev)=>{pool+=p;
    s.ls.push({t:T("intro",p),pool:p,focus:p,k:"intro",w:14});
    s.ls.push({t:T("prac",p),pool,focus:p,k:"prac",w:30});
    if(!skipRev)s.ls.push({t:T("rev",p),pool,focus:"",k:"rev",w:40});
    s.ls.push({t:T("big",p),pool,focus:p,k:"big",w:300});};
  let s=sec(fa()?"ردیف اصلی":"Home Row");
  s.ls.push({t:fa()?"آشنایی با تایپ":"Introduction to Typing",text:"asdf jkl; asdf jkl; fj fj dk dk sl sl a; a; fdsa jkl; fdsa jkl;".split("").map(tl).join("")});
  four(s,"fj",true);["dk","sl","a;","gh"].forEach(p=>four(s,p));
  s=sec(fa()?"ردیف بالا":"Top Row");["ru","ei","wo","qy","tp"].forEach(p=>four(s,p));
  if(fa()){four(s,"[]")}
  s=sec(fa()?"ردیف پایین":"Bottom Row");["vm","c,","x.","z/","bn"].forEach(p=>four(s,p));
  s=sec(fa()?"سطح پایه":"Basic Level");
  if(fa())BF.forEach((b,i)=>s.ls.push({t:"جمله‌های تمرینی "+(i+1),text:b+" "+b+" "+b,raw:1}));
  else BE.forEach(b=>s.ls.push({t:b[0],text:b[1]+" "+b[1]+" "+b[1]}));
  for(let i=1;i<=5;i++)s.ls.push({t:(fa()?"آزمون ۳۰۰ کلمه ":"300 Words Test ")+i,pool:FULL,focus:"",k:"big",w:300,real:1});
  const ks=[...new Set(Object.keys(STORIES[lang]).concat(Object.keys(BANK[lang])))].sort((a,b)=>a.localeCompare(b,lang));
  if(ks.length){s=sec(fa()?"داستان‌ها (حرف‌های بیشتر به‌زودی)":"Stories (more letters coming soon)");ks.forEach(k=>s.ls.push({t:(fa()?"داستان حرف ":"Story of letter ")+k.toUpperCase(),story:k}))}

}
function rnd(n){return Math.floor(Math.random()*n)}
function gen(l){
  if(l.story)return clean(STORIES[lang][l.story]||makeStory(lang,l.story));
  if(l.text)return l.text;
  const P=l.pool.split("").map(tl),Fc=(l.focus||"").split("").map(tl),WL=(fa()?WF:WE).filter(w=>[...w].every(c=>P.includes(c)));
  const useReal=WL.length>=6&&l.k!=="intro",w=[];
  for(let i=0;i<l.w;i++){
    if(useReal&&(l.real||Math.random()<.5)){w.push(WL[rnd(WL.length)]);continue}
    const len=l.k==="intro"?rnd(2)+2:rnd(3)+3;let x="";
    for(let j=0;j<len;j++)x+=P[rnd(P.length)];
    if(Fc[0]&&!Fc.some(c=>x.includes(c)))x=x.slice(0,-1)+Fc[rnd(Fc.length)];
    w.push(x)}
  return w.join(" ");
}
const key=()=>"tp2-"+lang;
function save(){try{localStorage.setItem(key(),JSON.stringify(prog))}catch(e){}}
function loadProg(){prog={};try{prog=JSON.parse(localStorage.getItem(key())||"{}")}catch(e){}}
function buildList(){
  $("list").innerHTML=`<button class="btn" id="goSt" style="margin:8px 0">📖 ${fa()?"داستان‌ها":"Stories"}</button>`+S.map(x=>`<h3${x.ls[0]&&x.ls[0].story?' id="stH"':''}>${x.n}</h3><div class="ls">`+x.ls.map(l=>{const p=prog[l.id];
    return `<button data-i="${l.id}" class="${l.id===cur?"on":""}"><span>${l.n}. ${l.t}</span><small>${p?("★".repeat(p.stars)||"·"):""}</small></button>`}).join("")+`</div>`).join("");
  $("list").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{load(+b.dataset.i);if(innerWidth<=820)$("menu").open=false});
  $("goSt").onclick=()=>$("stH").scrollIntoView({block:"start"});
}
function buildKb(){
  const R=fa()?["qwertyuiop[]","asdfghjkl;'","zxcvbnm,./"]:["1234567890","qwertyuiop","asdfghjkl;","zxcvbnm,./"];
  $("kb").innerHTML=R.map((r,i)=>`<div class="r" style="margin-inline-start:${(fa()?i+1:i)*10}px">`+r.split("").map(c=>{const m=tl(c);return `<div class="k f${FP[c]}" data-k="${m}">${m}</div>`}).join("")+`</div>`).join("")+`<div class="r"><div class="k sp" data-k=" ">${fa()?"فاصله":"space"}</div></div>`;
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function load(i){
  cur=i;const l=ALL[i];text=gen(l);pos=0;ok=0;err=0;t0=0;done=false;wrong=false;clearInterval(tm);
  $("ttl").textContent=(fa()?"درس ":"Lesson ")+l.n+": "+l.t;$("res").classList.remove("show");
  $("box").className=fa()?"fa":"";$("txt").dir=fa()?"rtl":"ltr";$("box").scrollTop=0;
  $("txt").innerHTML=text.split(" ").map((w,wi,a)=>`<span class="w">`+(w+(wi<a.length-1?" ":"")).split("").map(c=>`<span class="c">${c}</span>`).join("")+`</span>`).join("");
  chars=[...document.querySelectorAll("#txt .c")];
  upd();buildList();$("cap").focus({preventScroll:true});
}
function upd(){
  chars.forEach((c,i)=>{c.className="c"+(i<pos?" ok":i===pos?(wrong?" err":" cur"):"")});
  const nx=text[pos];
  document.querySelectorAll(".k.nx").forEach(k=>k.classList.remove("nx"));
  if(nx!==undefined){const k=document.querySelector(`.k[data-k="${CSS.escape(nx)}"]`);if(k)k.classList.add("nx");
    const f=nx===" "?"شست":FN[fing(nx)]||"";
    $("hint").textContent="حرف بعدی: "+(nx===" "?"فاصله (Space)":nx)+(f?" — انگشت "+f:"");
    const c=chars[pos];if(c){const b=$("box");const y=c.offsetTop-b.offsetTop;if(y>b.scrollTop+b.clientHeight-50||y<b.scrollTop)b.scrollTop=Math.max(0,y-50)}}
  const sec=t0?(Date.now()-t0)/1000:0,w=sec>1?Math.round(ok/5/(sec/60)):0;
  $("sW").textContent=w;$("sA").textContent=(ok+err?Math.round(ok/(ok+err)*100):100)+"%";
  $("sT").textContent=fmt(sec);$("sP").textContent=Math.round(pos/text.length*100)+"%";
}
function press(ch){
  if(done)return;if(!t0){t0=Date.now();tm=setInterval(upd,300)}
  if(ch===text[pos]){beep(1);pos++;ok++;wrong=false;if(pos>=text.length)return finish()}else{beep(0);err++;wrong=true}
  upd();
}
function finish(){
  done=true;clearInterval(tm);upd();
  const sec=Math.max((Date.now()-t0)/1000,3),wpm=Math.round(ok/5/(sec/60)),acc=Math.round(ok/(ok+err)*100);
  const st=acc>=97?3:acc>=92?2:acc>=85?1:0;
  const old=prog[cur];if(!old||st>old.stars||(st===old.stars&&wpm>old.wpm))prog[cur]={stars:st,wpm,acc};save();
  $("rt").textContent=st?"آفرین! درس تمام شد":"دقت بیشتر لازم است";
  $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("rd").textContent=`سرعت ${wpm} کلمه در دقیقه، دقت ${acc}%، ${err} خطا، زمان ${fmt(sec)}.`+(st?"":" برای رد شدن دقت حداقل ۸۵٪ لازم است؛ درس را تکرار کنید.");
  $("next").style.display=cur<ALL.length-1?"":"none";
  $("res").classList.add("show");buildList();
}
function setLang(l){
  lang=l;document.documentElement.dataset.lang=l;
  $("tEn").classList.toggle("on",l==="en");$("tFa").classList.toggle("on",l==="fa");
  $("note").textContent=fa()?"برای این بخش، کیبورد فارسی (Persian) باید در کامپیوتر یا موبایل شما فعال باشد. به صفحه‌کلید نگاه نکنید و با همه انگشتان تایپ کنید.":"نکته: به صفحه‌کلید نگاه نکنید و با همه انگشتان تایپ کنید. اگر اشتباه بزنید، باید همان حرف درست را بزنید تا ادامه پیدا کند.";
  build();loadProg();buildKb();
  let f=0;for(let i=0;i<ALL.length;i++){if(!prog[i]||!prog[i].stars){f=i;break}}
  load(f);
}
$("cap").addEventListener("input",e=>{const v=e.target.value;e.target.value="";for(const c of v)press(fa()?c:c.toLowerCase())});
$("cap").addEventListener("keydown",e=>{if(e.key==="Escape")load(cur)});

$("restart").onclick=()=>load(cur);$("again").onclick=()=>load(cur);$("next").onclick=()=>load(cur+1);
const sndTxt=()=>$("snd").textContent=muted?"🔇 صدا خاموش":"🔊 صدا روشن";sndTxt();
$("snd").onclick=()=>{muted=!muted;try{localStorage.setItem("tp2-mute",muted?"1":"0")}catch(e){}sndTxt()};

if(innerWidth<=820)$("menu").open=false;
setLang("en");
</script>
